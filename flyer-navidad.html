<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Navidad Cornerstone</title>
<meta name="viewport" content="width=1200">
<style>
  @font-face { font-family: "Fraunces"; src: url(assets/fonts/fraunces.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Plus Jakarta Sans"; src: url(assets/fonts/plus-jakarta-sans.woff2) format("woff2"); font-weight: 200 800; }
  /* ── Paleta ─────────────────────────────────────────────
     Cornerstone: Blue #004887 · Dark Navy #0D1427 · Blue Accent #95C9E1 / #D8E8F5
                  Action Red #CB333B (acento puntual)
     Navidad:     Dorado champán #E9CF94 / #C9A15A · Blanco nieve #F7FAFD           */
  :root {
    --navy: #0D1427;
    --blue: #004887;
    --blue-2: #95C9E1;
    --blue-3: #D8E8F5;
    --red: #CB333B;
    --gold: #C9A15A;
    --gold-lt: #E9CF94;
    --snow: #F7FAFD;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--navy); }
  body { width: 1200px; height: 1697px; overflow: hidden; }

  .flyer {
    position: relative; width: 1200px; height: 1697px; overflow: hidden;
    background:
      radial-gradient(620px 560px at 50% 22%, rgba(0,92,170,.55), transparent 70%),
      linear-gradient(180deg, #06335F 0%, #0A2447 38%, #0D1427 78%);
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    color: #fff;
  }
  svg.deco { position: absolute; inset: 0; width: 1200px; height: 1697px; }

  .logo {
    position: absolute; left: 72px; top: 64px; height: 42px;
    filter: brightness(0) invert(1);
  }

  .content {
    position: absolute; left: 0; right: 0; top: 700px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .title {
    font-family: "Fraunces", Georgia, serif;
    font-variation-settings: "SOFT" 30, "opsz" 144;
    font-weight: 500; font-size: 176px; line-height: 1;
    letter-spacing: .1em; margin-right: -.1em;
    background: linear-gradient(180deg, #FBEFCF 8%, #E9CF94 45%, #C9A15A 78%, #E6C98C 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 30px rgba(233,207,148,.28));
  }
  .title .tree { display: none; } /* 🎄 → representado por el árbol de símbolos */

  .divider { display: flex; align-items: center; gap: 16px; margin-top: 26px; }
  .divider i { display: block; width: 120px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-lt)); }
  .divider i:last-child { transform: scaleX(-1); }
  .divider svg { width: 18px; height: 18px; }

  .date {
    margin-top: 30px;
    font-size: 66px; font-weight: 700; letter-spacing: -.015em; line-height: 1;
    color: var(--snow);
  }
  .date span { font-weight: 300; }

  .meta {
    margin-top: 24px;
    display: flex; align-items: center; gap: 24px;
    font-size: 34px; font-weight: 500; color: var(--blue-2);
  }
  .meta .item { display: flex; align-items: center; gap: 12px; }
  .meta svg { width: 30px; height: 30px; flex: none; }
  .meta .bar { width: 1px; height: 34px; background: rgba(233,207,148,.6); font-size: 0; }

  .invite {
    margin-top: 54px;
    display: inline-flex; align-items: center; gap: 18px;
    padding: 20px 46px 20px 30px;
    border-radius: 999px;
    background: var(--snow);
    color: var(--navy);
    font-size: 40px; font-weight: 800; letter-spacing: -.01em;
    box-shadow: 0 0 0 2px #E9CF94, 0 0 50px rgba(233,207,148,.35);
  }
  .invite svg { width: 64px; height: 51px; flex: none; }

  .must {
    margin-top: 28px;
    display: flex; align-items: center; gap: 12px;
    font-size: 26px; font-weight: 600; color: var(--blue-3); letter-spacing: .01em;
  }
  .must i { width: 9px; height: 9px; border-radius: 2px; background: var(--red); transform: rotate(45deg); box-shadow: 0 0 10px rgba(203,51,59,.8); }
</style>
</head>
<body>
<main class="flyer">
  <svg class="deco" id="deco" viewBox="0 0 1200 1697" aria-hidden="true">
    <defs>
      <radialGradient id="glow"><stop offset="0" stop-color="#FFE2A0" stop-opacity=".8"/><stop offset=".35" stop-color="#FFE2A0" stop-opacity=".25"/><stop offset="1" stop-color="#FFE2A0" stop-opacity="0"/></radialGradient>
      <radialGradient id="bokehB"><stop offset="0" stop-color="#95C9E1" stop-opacity=".35"/><stop offset="1" stop-color="#95C9E1" stop-opacity="0"/></radialGradient>
      <radialGradient id="bokehG"><stop offset="0" stop-color="#E9CF94" stop-opacity=".32"/><stop offset="1" stop-color="#E9CF94" stop-opacity="0"/></radialGradient>
      <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B5D8E"/><stop offset="1" stop-color="#1A3F68"/></linearGradient>
      <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D8E8F5"/><stop offset="1" stop-color="#AFCFE6"/></linearGradient>
      <linearGradient id="hill3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7FAFD"/><stop offset="1" stop-color="#D8E8F5"/></linearGradient>
      <filter id="shine" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <symbol id="spark" viewBox="-10 -10 20 20"><path d="M0-10C.8-2.5 2.5-.8 10 0 2.5.8.8 2.5 0 10-.8 2.5-2.5.8-10 0-2.5-.8-.8-2.5 0-10Z" fill="currentColor"/></symbol>
    </defs>

    <g id="bokeh"></g>
    <g id="tree"></g>

    <!-- paisaje nevado -->
    <path d="M0 1395 C 180 1360, 330 1372, 470 1400 S 820 1420, 960 1385 S 1140 1360, 1200 1375 V1697 H0Z" fill="url(#hill1)" opacity=".75"/>
    <path d="M0 1470 C 240 1430, 470 1445, 700 1478 S 1060 1500, 1200 1455 V1697 H0Z" fill="url(#hill2)"/>
    <path d="M0 1560 C 300 1528, 560 1540, 820 1568 S 1100 1580, 1200 1560 V1697 H0Z" fill="url(#hill3)"/>
    <g id="scene"></g>
    <g id="snow"></g>
  </svg>

  <img class="logo" src="assets/logo-cornerstone-horizontal.png" alt="Cornerstone">

  <section class="content">
    <h1 class="title">NAVIDAD<span class="tree"> 🎄</span></h1>
    <div class="divider"><i></i><svg viewBox="-10 -10 20 20"><use href="#spark" x="-10" y="-10" width="20" height="20" color="#E9CF94"/></svg><i></i></div>

    <p class="date"><span>Viernes</span> 18 de diciembre</p>

    <p class="meta">
      <span class="item">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E9CF94" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
        10:00 a. m. – 12:00 p. m.
      </span>
      <span class="bar">|</span>
      <span class="item">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E9CF94" stroke-width="1.8" stroke-linejoin="round"><path d="M12 21s-7-6.3-7-11.5a7 7 0 0 1 14 0C19 14.7 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        En la oficina
      </span>
    </p>

    <p class="invite">
      <!-- adulto y niño de la mano -->
      <svg viewBox="0 0 58 46">
        <circle cx="18" cy="7" r="6" fill="#004887"/>
        <path d="M10 19a8 8 0 0 1 16 0v11h-3v14h-4V33h-2v11h-4V30h-3Z" fill="#004887"/>
        <circle cx="43" cy="18" r="4.6" fill="#CB333B"/>
        <path d="M37 28a6 6 0 0 1 12 0v6h-2v10h-3v-7h-2v7h-3V34h-2Z" fill="#CB333B"/>
        <path d="M26 23 L31 29 L37 28" fill="none" stroke="#0D1427" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      ¡Ven con tus hijos!
    </p>

    <p class="must"><i></i>Asistencia obligatoria.</p>
  </section>
</main>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  /* luces desenfocadas */
  const bokeh = document.getElementById("bokeh");
  [[140,300,90,"G"],[1060,260,110,"B"],[980,560,70,"G"],[210,640,80,"B"],[1100,860,60,"G"],[90,980,70,"G"],[620,120,60,"B"],[360,190,40,"G"],[860,120,46,"G"],[1010,1140,90,"B"],[170,1250,70,"B"]]
    .forEach(([x, y, r, c]) => el("circle", { cx: x, cy: y, r, fill: `url(#bokeh${c})` }, bokeh));

  /* ── Símbolo Cornerstone (cuatro C entrelazadas) redibujado en vector ──
     Sistema de 20 × 20 unidades. Las piezas "rojas" van en dorado y las
     "azules" en celeste hielo; el tejido se marca con un contorno del fondo. */
  const R = 2.5;
  const ring = (x1, y1, x2, y2, gap) => {
    // rectángulo redondeado abierto por un lado (gap: top|bottom|left|right)
    const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2, g = 1.75;
    const seq = {
      top:    `M${cx - g} ${y1} H${x1 + R} Q${x1} ${y1} ${x1} ${y1 + R} V${y2 - R} Q${x1} ${y2} ${x1 + R} ${y2} H${x2 - R} Q${x2} ${y2} ${x2} ${y2 - R} V${y1 + R} Q${x2} ${y1} ${x2 - R} ${y1} H${cx + g}`,
      bottom: `M${cx + g} ${y2} H${x2 - R} Q${x2} ${y2} ${x2} ${y2 - R} V${y1 + R} Q${x2} ${y1} ${x2 - R} ${y1} H${x1 + R} Q${x1} ${y1} ${x1} ${y1 + R} V${y2 - R} Q${x1} ${y2} ${x1 + R} ${y2} H${cx - g}`,
      left:   `M${x1} ${cy + g} V${y2 - R} Q${x1} ${y2} ${x1 + R} ${y2} H${x2 - R} Q${x2} ${y2} ${x2} ${y2 - R} V${y1 + R} Q${x2} ${y1} ${x2 - R} ${y1} H${x1 + R} Q${x1} ${y1} ${x1} ${y1 + R} V${cy - g}`,
      right:  `M${x2} ${cy - g} V${y1 + R} Q${x2} ${y1} ${x2 - R} ${y1} H${x1 + R} Q${x1} ${y1} ${x1} ${y1 + R} V${y2 - R} Q${x1} ${y2} ${x1 + R} ${y2} H${x2 - R} Q${x2} ${y2} ${x2} ${y2 - R} V${cy + g}`,
    };
    return seq[gap];
  };
  const W = 1.85;
  const pieces = {
    t: ring(3.6, 0.93, 16.4, 6.0, "top"),
    b: ring(3.6, 14.0, 16.4, 19.07, "bottom"),
    l: ring(0.93, 3.6, 6.0, 16.4, "left"),
    r: ring(14.0, 3.6, 19.07, 16.4, "right"),
  };
  // tramos que pasan por encima en los cruces interiores (tejido de cadena)
  const overs = ["M6 4.6V7.4", "M14 12.6V15.4", "M12.6 6H15.4", "M4.6 14H7.4"];
  const symbol = (parent, x, y, size, cA, cB, bg) => {
    const g = el("g", { transform: `translate(${x - size / 2} ${y - size / 2}) scale(${size / 20})`, fill: "none", "stroke-linecap": "butt", "stroke-linejoin": "round" }, parent);
    const draw = (d, c) => el("path", { d, stroke: c, "stroke-width": W }, g);
    draw(pieces.l, cB); draw(pieces.r, cB); draw(pieces.t, cA); draw(pieces.b, cA);
    draw(overs[0], cB); draw(overs[1], cB); draw(overs[2], cA); draw(overs[3], cA);
    return g;
  };

  /* ── Árbol de los cornerstones ── */
  const tree = document.getElementById("tree");
  const s = 84, gap = 12, top = 250, cx = 600;
  const rows = [1, 2, 3, 4];
  const palettes = [
    ["#E9CF94", "#95C9E1"], ["#E9CF94", "#F7FAFD"], ["#CB333B", "#95C9E1"]
  ];
  let k = 0;
  const bgAt = y => y < 400 ? "#0B3A6A" : y < 560 ? "#0A2F58" : "#0A2749";
  // halo detrás del árbol
  el("circle", { cx, cy: 440, r: 300, fill: "url(#bokehG)" }, tree);
  rows.forEach((n, i) => {
    const y = top + i * (s + gap) + s / 2;
    for (let j = 0; j < n; j++) {
      const x = cx + (j - (n - 1) / 2) * (s + gap);
      const accent = (i === 2 && j === 0) || (i === 3 && j === 2) || (i === 1 && j === 1);
      const [a, b] = accent ? palettes[2] : palettes[k++ % 2];
      symbol(tree, x, y, s, a, b, bgAt(y));
    }
  });
  // guirnalda de luces que cruza el árbol
  const garland = el("path", { d: `M${cx - 120} ${top + 150} Q ${cx + 20} ${top + 205} ${cx + 150} ${top + 175} M${cx - 190} ${top + 300} Q ${cx} ${top + 360} ${cx + 205} ${top + 300}`, fill: "none", stroke: "#E9CF94", "stroke-width": 1.4, "stroke-opacity": .55 }, tree);
  const gl = garland.getTotalLength();
  for (let t = 0; t <= 1.0001; t += 1 / 22) {
    const p = garland.getPointAtLength(gl * t);
    el("circle", { cx: p.x, cy: p.y, r: 11, fill: "url(#glow)" }, tree);
    el("circle", { cx: p.x, cy: p.y, r: 2.6, fill: "#FFF3D1" }, tree);
  }
  // estrella
  el("circle", { cx, cy: top - 44, r: 110, fill: "url(#glow)" }, tree);
  el("use", { href: "#spark", x: cx - 38, y: top - 82, width: 76, height: 76, color: "#F6E3B0", filter: "url(#shine)" }, tree);
  el("use", { href: "#spark", x: cx - 14, y: top - 58, width: 28, height: 28, color: "#FFFFFF" }, tree);

  /* ── Escena: familia sobre la nieve ── */
  const scene = document.getElementById("scene");
  const fam = [];
  const person = (x, base, h, color, extra = {}) => {
    const g = el("g", {}, scene);
    const r = h * .125, hy = base - h + r;
    const sy = hy + r + h * .035, wt = h * .30, wb = h * .36, legH = h * .2, bodyB = base - legH;
    const rr = wt * .32;
    el("path", { d: `M${x - wb / 2} ${bodyB} L${x - wt / 2} ${sy + rr} Q${x - wt / 2} ${sy} ${x - wt / 2 + rr} ${sy} H${x + wt / 2 - rr} Q${x + wt / 2} ${sy} ${x + wt / 2} ${sy + rr} L${x + wb / 2} ${bodyB} Z`, fill: color, stroke: color, "stroke-width": 6, "stroke-linejoin": "round" }, g);
    const lw = h * .085;
    el("rect", { x: x - wb * .3 - lw / 2, y: bodyB - 4, width: lw, height: legH + 4, rx: lw / 2, fill: color }, g);
    el("rect", { x: x + wb * .3 - lw / 2, y: bodyB - 4, width: lw, height: legH + 4, rx: lw / 2, fill: color }, g);
    el("circle", { cx: x, cy: hy, r, fill: color }, g);
    if (extra.hat) {
      el("path", { d: `M${x - r * 1.02} ${hy - r * .15} A${r * 1.02} ${r * 1.02} 0 0 1 ${x + r * 1.02} ${hy - r * .15} Z`, fill: extra.hat }, g);
      el("rect", { x: x - r * 1.1, y: hy - r * .3, width: r * 2.2, height: r * .42, rx: r * .2, fill: "#F7FAFD" }, g);
      el("circle", { cx: x, cy: hy - r * 1.12, r: r * .3, fill: "#F7FAFD" }, g);
    }
    if (extra.scarf) {
      el("rect", { x: x - wt * .55, y: sy - 2, width: wt * 1.1, height: h * .06, rx: h * .03, fill: extra.scarf }, g);
      el("rect", { x: x + wt * .12, y: sy, width: h * .06, height: h * .17, rx: h * .03, fill: extra.scarf }, g);
    }
    const p = { x, sy, h, wt, color, g };
    fam.push(p);
    return p;
  };
  const arm = (p, hx, hy) => el("path", { d: `M${p.x + Math.sign(hx - p.x) * p.wt * .42} ${p.sy + p.h * .06} L${hx} ${hy}`, stroke: p.color, "stroke-width": p.h * .075, "stroke-linecap": "round", fill: "none" }, scene);
  const hold = (a, b) => {
    const hx = (a.x + b.x) / 2, hy = Math.max(a.sy + a.h * .36, b.sy + b.h * .36) - Math.min(a.h, b.h) * .02;
    arm(a, hx, hy); arm(b, hx, hy);
  };
  const free = (p, dir) => arm(p, p.x + dir * (p.wt * .62 + p.h * .06), p.sy + p.h * .4);

  const X = 560;
  const dad = person(X - 130, 1616, 150, "#0D1427", { scarf: "#E9CF94" });
  const kid1 = person(X - 58, 1622, 90, "#004887", { hat: "#CB333B" });
  const mom = person(X + 12, 1618, 140, "#0D1427");
  const kid2 = person(X + 72, 1624, 74, "#004887", { scarf: "#CB333B" });
  free(dad, -1); hold(dad, kid1); hold(kid1, mom); hold(mom, kid2); free(kid2, 1);
  fam.forEach(p => scene.appendChild(p.g));

  // regalos
  const gift = (x, base, w, h, box, ribbon) => {
    const g = el("g", {}, scene);
    el("rect", { x, y: base - h, width: w, height: h, rx: 4, fill: box }, g);
    el("rect", { x: x - 4, y: base - h - 4, width: w + 8, height: h * .24, rx: 3, fill: box }, g);
    el("rect", { x: x + w / 2 - 4.5, y: base - h - 4, width: 9, height: h + 4, fill: ribbon }, g);
    const cx = x + w / 2, cy = base - h - 4;
    el("path", { d: `M${cx} ${cy}c-6-13-22-13-20-4 2 6 13 4 20 4Zm0 0c6-13 22-13 20-4-2 6-13 4-20 4Z`, fill: "none", stroke: ribbon, "stroke-width": 3.6, "stroke-linejoin": "round" }, g);
  };
  gift(690, 1624, 62, 54, "#CB333B", "#E9CF94");
  gift(760, 1626, 46, 38, "#C9A15A", "#0D1427");
  gift(334, 1622, 48, 40, "#004887", "#E9CF94");

  /* ── Nieve ── */
  const snow = document.getElementById("snow");
  for (let i = 0; i < 140; i++) {
    const x = rnd() * 1200, y = rnd() * 1560, r = .8 + rnd() * rnd() * 3.4;
    // evitar la zona del texto principal para mantener la lectura limpia
    if (y > 690 && y < 1320 && x > 150 && x < 1050) continue;
    el("circle", { cx: x, cy: y, r, fill: "#FFFFFF", "fill-opacity": .25 + rnd() * .55 }, snow);
  }
})();
</script>
</body>
</html>
