<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Aniversario Cornerstone</title>
<meta name="viewport" content="width=1200">
<style>
  @font-face { font-family: "Fraunces"; src: url(../assets/fonts/fraunces.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Plus Jakarta Sans"; src: url(../assets/fonts/plus-jakarta-sans.woff2) format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Caveat"; src: url(../assets/fonts/caveat.woff2) format("woff2"); font-weight: 400 700; }
  /* Paleta Cornerstone: Dark Navy #0D1427 · Blue #004887 · Logo Blue #1A509D
     Blue Accent #95C9E1 · Blue Accent #D8E8F5 · Action Red #CB333B (acento mínimo) */
  :root {
    --navy: #0D1427;
    --blue: #004887;
    --logo-blue: #1A509D;
    --blue-2: #95C9E1;
    --blue-3: #D8E8F5;
    --red: #CB333B;
    --ink-soft: #3E4A63;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--navy); }
  body { width: 1200px; height: 1500px; overflow: hidden; }

  .card {
    position: relative; width: 1200px; height: 1500px; overflow: hidden;
    background:
      radial-gradient(760px 560px at 50% 30%, rgba(149,201,225,.20), transparent 65%),
      radial-gradient(900px 700px at -5% 70%, rgba(0,72,135,.70), transparent 65%),
      radial-gradient(900px 700px at 105% 15%, rgba(0,72,135,.60), transparent 65%),
      radial-gradient(1000px 500px at 50% 112%, rgba(0,72,135,.65), transparent 70%),
      var(--navy);
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    color: #fff; text-align: center;
    word-spacing: .08em;
  }
  .card svg.deco { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card > * { position: absolute; }

  .logo-plate {
    left: 50%; top: 40px; transform: translateX(-50%);
    padding: 16px 34px; border-radius: 18px; background: #fff;
    box-shadow: 0 12px 30px rgba(0,0,0,.30);
  }
  .logo-plate img { display: block; height: 36px; }

  .eyebrow {
    left: 0; right: 0; top: 142px;
    font-size: 20px; font-weight: 700; letter-spacing: .34em; text-transform: uppercase;
    color: var(--blue-2);
  }
  .eyebrow i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin: 0 18px; transform: translateY(-3px); }

  .portrait { left: 50%; top: 190px; width: 330px; height: 390px; transform: translateX(-50%); }
  .arch {
    position: absolute; inset: 0;
    border-radius: 165px 165px 28px 28px;
    background: #fff; padding: 10px;
    box-shadow: 0 30px 70px rgba(0,0,0,.45), 0 0 0 2px rgba(149,201,225,.5);
  }
  .arch img {
    width: 100%; height: 100%; display: block; object-fit: cover; object-position: 50% 30%;
    border-radius: 155px 155px 19px 19px; background: #fff;
  }
  .badge {
    position: absolute; right: -112px; bottom: -30px;
    width: 180px; height: 180px; border-radius: 50%;
    background: #fff; color: var(--blue);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 18px 44px rgba(0,0,0,.45);
  }
  .badge .ring { position: absolute; inset: 0; width: 100%; height: 100%; }
  .badge .n {
    font-family: "Fraunces", Georgia, serif; font-weight: 700;
    font-variation-settings: "SOFT" 100, "opsz" 144;
    font-size: 86px; line-height: .9; color: var(--blue);
  }
  .badge .u { margin-top: 2px; font-size: 17px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--navy); }
  .badge .dot { position: absolute; top: 21px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); }
  .sparkles { position: absolute; left: -70px; top: -70px; width: 470px; height: 530px; overflow: visible; z-index: 2; }

  .greet {
    left: 0; right: 0; top: 622px;
    font-family: "Fraunces", Georgia, serif; font-weight: 600;
    font-variation-settings: "SOFT" 100, "opsz" 144;
    font-size: 42px; line-height: 1; color: var(--blue-2);
  }
  .name {
    left: 30px; right: 30px; top: 672px;
    font-family: "Fraunces", Georgia, serif; font-weight: 700;
    font-variation-settings: "SOFT" 100, "opsz" 144;
    font-size: 92px; line-height: 1; letter-spacing: -.01em; color: #fff;
  }
  .role {
    left: 50%; top: 790px; transform: translateX(-50%); white-space: nowrap;
    padding: 9px 24px; border-radius: 999px;
    border: 1.5px solid rgba(149,201,225,.45); background: rgba(149,201,225,.10);
    font-size: 20px; font-weight: 700; letter-spacing: .08em; color: #fff;
  }

  /* ── Nota de agradecimiento ── */
  .note {
    left: 80px; right: 80px; top: 912px; height: 440px;
    background: #fff; border-radius: 30px; color: var(--navy);
    box-shadow: 0 30px 70px rgba(0,0,0,.40);
    padding: 64px 76px 0;
  }
  .note::before {   /* filete superior con los colores de la marca */
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10px; border-radius: 30px 30px 0 0;
    background: linear-gradient(90deg, var(--blue) 0%, var(--blue-2) 50%, var(--blue) 100%);
  }
  .seal {
    position: absolute; left: 50%; top: -46px; transform: translateX(-50%);
    width: 92px; height: 92px; border-radius: 50%; background: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 24px rgba(0,0,0,.25), inset 0 0 0 3px var(--blue-3);
  }
  .seal img { width: 54px; height: 54px; }
  .message { height: 220px; display: flex; align-items: center; justify-content: center; }
  .message p { font-size: 28px; line-height: 1.55; color: var(--ink-soft); }
  .message strong { color: var(--blue); font-weight: 800; }
  .sign { margin-top: 22px; }
  .sign .hand { font-family: "Caveat", cursive; font-weight: 700; font-size: 50px; line-height: 1; color: var(--logo-blue); display: inline-block; transform: rotate(-2deg); }
  .sign .team { margin-top: 10px; font-size: 18px; font-weight: 800; letter-spacing: .28em; text-transform: uppercase; color: var(--navy); }

  .thanks {
    left: 0; right: 0; top: 1392px;
    font-size: 30px; font-weight: 800; color: #fff; letter-spacing: .005em;
  }
  .thanks .shine {
    background: linear-gradient(100deg, #fff 0%, #fff 40%, var(--blue-2) 50%, #fff 60%, #fff 100%);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .foot {
    left: 0; right: 0; bottom: 40px;
    font-size: 15px; font-weight: 700; letter-spacing: .32em; text-transform: uppercase; color: rgba(149,201,225,.6);
  }
</style>
</head>
<body>
<div class="card">
  <svg class="deco" viewBox="0 0 1200 1500" aria-hidden="true">
    <g id="ripples" fill="none" stroke="#95C9E1"></g>
    <g id="confetti"></g>
  </svg>

  <div class="logo-plate"><img src="../assets/logo-cornerstone-horizontal.png" alt="Cornerstone"></div>
  <div class="eyebrow" id="eyebrow"></div>

  <div class="portrait">
    <div class="arch"><img id="photo" alt=""></div>
    <svg class="sparkles" id="sparkles" viewBox="0 0 470 530" aria-hidden="true"></svg>
    <div class="badge">
      <svg class="ring" viewBox="0 0 180 180"><circle id="ring" cx="90" cy="90" r="80" fill="none" stroke="#004887" stroke-opacity=".4" stroke-width="2.5" stroke-linecap="round"/></svg>
      <span class="dot"></span><span class="n" id="years"></span><span class="u" id="unit"></span>
    </div>
  </div>

  <div class="greet">¡Feliz aniversario,</div>
  <div class="name" id="name"></div>
  <div class="role" id="role"></div>

  <div class="note">
    <div class="seal"><img src="../assets/simbolo-cornerstone.png" alt=""></div>
    <div class="message"><p id="message"></p></div>
    <div class="sign">
      <div class="hand">Con cariño y gratitud,</div>
      <div class="team">Todo el equipo Cornerstone</div>
    </div>
  </div>

  <div class="thanks"><span class="shine" id="shine">Gracias por seguir creciendo con nosotros</span></div>
  <div class="foot">Noviembre 2026</div>
</div>

<script>
  const PEOPLE = {
    "bianca-lozano":         { first: "Bianca",      role: "Consultant Trainee",  day: 3,  years: 1 },
    "juan-manuel-gutierrez": { first: "Juan Manuel", role: "Managing Consultant", day: 8,  years: 5 },
    "ana-lucia-pacheco":     { first: "Ana Lucía",   role: "Consultant Trainee",  day: 10, years: 1 },
  };
  const MONTH = "noviembre";
  const WORDS = ["", "un", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve", "diez", "once", "doce"];
  const cap = s => s[0].toUpperCase() + s.slice(1);

  function message(y) {
    const w = WORDS[y];
    if (y === 1) return `Hace un año llegaste a Cornerstone y desde el primer día sumaste tu energía, tus ideas y tus ganas de aprender. <strong>Gracias por este primer año</strong>: lo que aportas ya se nota en el equipo, y lo mejor está por venir.`;
    if (y <= 4)  return `Hoy celebramos <strong>${w} años</strong> desde que llegaste a Cornerstone. Gracias por tu compromiso, tu talento y la calidez con la que acompañas a cada persona del equipo. Tu trabajo hace la diferencia y <strong>queremos que sepas cuánto lo valoramos</strong>.`;
    if (y <= 7)  return `<strong>${cap(w)} años construyendo juntos.</strong> Gracias por tu constancia, tu criterio y tu generosidad para compartir lo que sabes. Eres parte esencial de lo que Cornerstone es hoy, y <strong>nos llena de orgullo seguir creciendo a tu lado</strong>.`;
    return `<strong>${cap(w)} años de historia compartida.</strong> Gracias por tu entrega, tu liderazgo y por dejar huella en cada persona que ha pasado por Cornerstone. Tu trayectoria inspira a todo el equipo y <strong>es uno de los pilares de lo que somos</strong>.`;
  }

  const slug = new URLSearchParams(location.search).get("p") || "bianca-lozano";
  const p = PEOPLE[slug];
  document.getElementById("photo").src = `fotos/${slug}.jpg`;
  document.getElementById("name").textContent = `${p.first}!`;
  document.getElementById("role").textContent = p.role;
  document.getElementById("years").textContent = p.years;
  document.getElementById("unit").textContent = p.years === 1 ? "año" : "años";
  document.getElementById("eyebrow").innerHTML = `${String(p.day).padStart(2, "0")} de ${MONTH}<i></i>${p.years === 1 ? "1 año" : p.years + " años"} en Cornerstone`;
  document.getElementById("message").innerHTML = message(p.years);

  // ── Animación en bucle perfecto: todo es función de t ∈ [0, 1).
  //    render.js fija t cuadro por cuadro; abierta en el navegador corre sola.
  const W = 1200, H = 1500, TAU = Math.PI * 2, NS = "http://www.w3.org/2000/svg";
  let seed = 11; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const cols = ["#95C9E1", "#D8E8F5", "#FFFFFF", "#1A509D", "#95C9E1", "#CB333B", "#FFFFFF"];
  const pieces = [];
  while (pieces.length < 70) {
    const x = r() * W;
    if (Math.abs(x - W / 2) < 250) continue;             // columna central despejada
    const kind = r();
    const el = document.createElementNS(NS, kind < .5 ? "rect" : kind < .78 ? "circle" : "path");
    const c = cols[Math.floor(r() * cols.length)];
    if (kind < .5) { el.setAttribute("width", 8 + r() * 8); el.setAttribute("height", 4 + r() * 3); el.setAttribute("rx", 1.5); el.setAttribute("fill", c); }
    else if (kind < .78) { el.setAttribute("r", 2.4 + r() * 3.4); el.setAttribute("fill", c); }
    else { el.setAttribute("d", "M0 0 q 6 -8 12 0 t 12 0"); el.setAttribute("fill", "none"); el.setAttribute("stroke", c); el.setAttribute("stroke-width", 2.8); el.setAttribute("stroke-linecap", "round"); }
    el.setAttribute("opacity", (.45 + r() * .5).toFixed(2));
    document.getElementById("confetti").appendChild(el);
    pieces.push({ el, base: +el.getAttribute("opacity"), x, y0: r(), laps: r() < .75 ? 1 : 2, sway: 8 + r() * 18, ph: r(), spin: (r() < .5 ? -1 : 1) * (1 + Math.floor(r() * 2)), a0: r() * 360 });
  }
  const ripples = [0, 1, 2].map(() => { const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", W / 2); c.setAttribute("cy", 385); document.getElementById("ripples").appendChild(c); return c; });

  const STAR = "M0 -1 C .12 -.12 .12 -.12 1 0 C .12 .12 .12 .12 0 1 C -.12 .12 -.12 .12 -1 0 C -.12 -.12 -.12 -.12 0 -1Z";
  const sparks = [[-36, 46, 26, 0], [368, 70, 19, .33], [-50, 270, 17, .6], [-44, 150, 14, .8], [352, 196, 20, .15], [-16, 398, 13, .45]].map(([x, y, size, ph]) => {
    const el = document.createElementNS(NS, "path"); el.setAttribute("d", STAR); el.setAttribute("fill", "#fff");
    document.getElementById("sparkles").appendChild(el); return { el, x: x + 70, y: y + 70, size, ph };
  });

  const ring = document.getElementById("ring"), DASHES = 24, CIRC = TAU * 80;
  ring.setAttribute("stroke-dasharray", `${CIRC / DASHES * .45} ${CIRC / DASHES * .55}`);
  const badge = document.querySelector(".badge"), shine = document.getElementById("shine");

  // zonas de texto donde el confeti se desvanece: [centro y, media altura, media anchura]
  const CLEAR = [[78, 52, 240], [154, 28, 400], [715, 60, 330], [812, 26, 170], [1405, 32, 340]];
  function clearAt(x, y) {
    let o = 1;
    for (const [cy, hh, hw] of CLEAR) {
      if (Math.abs(x - W / 2) > hw + 20) continue;
      const d = Math.abs(y - cy) - hh;
      o = Math.min(o, Math.max(0, Math.min(1, d / 30)));
    }
    return o;
  }

  window.setFrame = function (t) {
    const span = H + 60;
    for (const q of pieces) {
      const y = ((q.y0 + q.laps * t) % 1) * span - 30;
      const x = q.x + q.sway * Math.sin(TAU * (t * 2 + q.ph));
      q.el.style.opacity = (q.base * clearAt(x, y)).toFixed(2);
      q.el.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(q.a0 + 360 * q.spin * t).toFixed(1)})`);
    }
    ripples.forEach((c, i) => {
      const k = (t + i / 3) % 1;
      c.setAttribute("r", (215 + k * 260).toFixed(1));
      c.setAttribute("stroke-opacity", (.3 * (1 - k)).toFixed(3));
      c.setAttribute("stroke-width", (2.5 - k * 1.5).toFixed(2));
    });
    for (const sp of sparks) {
      const v = Math.max(0, Math.sin(TAU * (t * 2 + sp.ph)));
      sp.el.setAttribute("transform", `translate(${sp.x} ${sp.y}) scale(${(sp.size * (.35 + .65 * v)).toFixed(2)}) rotate(${(90 * t).toFixed(1)})`);
      sp.el.setAttribute("opacity", (.25 + .75 * v).toFixed(2));
    }
    badge.style.transform = `scale(${(1 + .05 * Math.max(0, Math.sin(TAU * t * 2))).toFixed(3)})`;
    ring.setAttribute("transform", `rotate(${(-90 + 360 / DASHES * 2 * t).toFixed(2)} 90 90)`);
    // brillo que recorre la frase final en la segunda mitad del bucle
    const k = Math.min(1, Math.max(0, (t - .45) / .45));
    shine.style.backgroundPosition = `${(100 - k * 100).toFixed(1)}% 0`;
  };
  window.setFrame(0);
  if (!navigator.webdriver) { const t0 = performance.now(); (function loop(now) { setFrame(((now - t0) / 3000) % 1); requestAnimationFrame(loop); })(t0); }
</script>
</body>
</html>
