<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluación de desempeño · Piloto</title>
<style>
  :root {
    --bg: #151a22;
    --panel: #1c232e;
    --card: #232c39;
    --card-2: #283243;
    --line: #364254;
    --text: #e7eaf0;
    --muted: #a7b0be;
    --accent: #7d9fd0;
    --accent-bg: #2c4466;
    --ok: #79b294;
    --error: #e3a090;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, p { margin: 0; }
  button, input, textarea { font: inherit; color: inherit; }

  /* Barra superior */
  .top {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand h1 { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag {
    font-size: 12px; font-weight: 600; letter-spacing: .02em;
    padding: 2px 8px; border-radius: 99px;
    background: var(--accent-bg); color: #d6e2f3;
  }
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--card-2); border: 1px solid var(--line);
    font-size: 13px; font-weight: 600; color: var(--accent);
  }
  .who-text { font-size: 13px; line-height: 1.3; min-width: 0; }
  .who-text b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who-text span { color: var(--muted); }

  /* Distribución */
  .layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); max-width: 1180px; margin: 0 auto; }
  .steps { position: sticky; top: 59px; align-self: start; padding: 24px 16px 24px 24px; }
  .steps ol { list-style: none; margin: 0; padding: 0; }
  .steps li button {
    width: 100%; display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border: 0; border-radius: 8px;
    background: none; text-align: left; font-size: 14px; color: var(--muted); cursor: pointer;
  }
  .steps li button:disabled { cursor: default; opacity: .55; }
  .steps li button:not(:disabled):hover { background: var(--card); }
  .steps li.actual button { background: var(--card); color: var(--text); font-weight: 600; }
  .dot {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center;
    border: 1.5px solid var(--line); font-size: 11px; font-weight: 700;
  }
  .steps li.actual .dot { border-color: var(--accent); color: var(--accent); }
  .steps li.listo .dot { background: var(--ok); border-color: var(--ok); color: var(--bg); }
  .avance { margin-top: 18px; padding: 0 10px; font-size: 13px; color: var(--muted); }
  .barra { height: 6px; margin-top: 6px; border-radius: 99px; background: var(--card-2); overflow: hidden; }
  .barra i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }

  main { padding: 24px 24px 120px; min-width: 0; }
  .movil { display: none; }
  .vista { max-width: 820px; }

  .encabezado { margin-bottom: 18px; }
  .kicker { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .encabezado h2 { font-size: 22px; font-weight: 600; }
  .definicion {
    margin-top: 14px; padding: 14px 16px;
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: var(--radius); color: #d3d8e1;
  }
  .definicion b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
  .guia { margin-top: 12px; font-size: 14px; color: var(--muted); }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; margin-bottom: 14px;
  }
  .card.falta { border-color: var(--error); }
  .item-head { display: flex; gap: 10px; align-items: baseline; }
  .num { flex: none; font-size: 13px; font-weight: 700; color: var(--accent); }
  .item-head h3 { font-size: 16px; font-weight: 600; }
  .item-text { margin: 6px 0 14px; color: #d3d8e1; }

  /* Escala de calificación */
  .escala { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .opt { position: relative; display: block; cursor: pointer; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt-box {
    height: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px;
    padding: 10px 6px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card-2); transition: background .15s, border-color .15s;
  }
  .opt:hover .opt-box { border-color: #50607a; }
  .opt-n { font-size: 18px; font-weight: 700; line-height: 1.2; }
  .opt-l { font-size: 13px; font-weight: 600; line-height: 1.25; }
  .opt-f { font-size: 12px; color: var(--muted); line-height: 1.3; }
  .opt-txt { display: flex; flex-direction: column; gap: 2px; }
  .opt-f > span { display: block; }
  .opt input:checked + .opt-box { background: var(--accent-bg); border-color: var(--accent); }
  .opt input:checked + .opt-box .opt-f { color: #c9d6ea; }
  .opt input:focus-visible + .opt-box { outline: 2px solid var(--accent); outline-offset: 2px; }

  .extra { margin-top: 8px; display: inline-flex; }
  .extra .opt-box { flex-direction: row; gap: 8px; padding: 7px 12px; font-size: 13px; font-weight: 600; }
  .ayuda { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .error { display: none; margin-top: 8px; font-size: 13px; color: var(--error); }
  .falta .error { display: block; }

  /* Formularios */
  .campo { margin-bottom: 16px; }
  .campo > label, .campo > .label { display: block; font-weight: 600; margin-bottom: 6px; }
  .campo .opcional { font-weight: 400; color: var(--muted); }
  input[type=text], textarea {
    width: 100%; padding: 10px 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  }
  textarea { min-height: 96px; resize: vertical; }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--accent); }
  ::placeholder { color: #7d8797; }
  .opciones { display: flex; flex-direction: column; gap: 8px; }
  .opciones.fila { flex-direction: row; flex-wrap: wrap; }
  .opciones .opt-box { flex-direction: row; justify-content: flex-start; text-align: left; gap: 10px; padding: 10px 14px; font-weight: 500; }
  .marca { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--muted); }
  .opt input:checked + .opt-box .marca { border: 5px solid var(--accent); }

  .comentario label { font-weight: 600; }

  /* Inicio */
  .intro p + p { margin-top: 10px; }
  .puntos { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .puntos li { padding-left: 14px; border-left: 2px solid var(--line); }
  .puntos b { color: var(--text); }
  .tabla { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  .tabla th, .tabla td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .tabla th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .tabla td:first-child { font-weight: 700; color: var(--accent); width: 40px; }

  /* Acciones */
  .acciones {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: var(--panel); border-top: 1px solid var(--line);
  }
  .acciones-in {
    max-width: 1180px; margin: 0 auto; padding: 12px 24px 12px 318px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .acciones-in > div { max-width: 820px; width: 100%; display: flex; justify-content: space-between; gap: 12px; }
  .btn {
    padding: 10px 20px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); font-weight: 600; cursor: pointer;
  }
  .btn:hover { background: var(--card-2); }
  .btn.primario { background: #3b5f92; border-color: #4d72a8; color: #fff; }
  .btn.primario:hover { background: #456ca3; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .aviso { margin-top: 12px; color: var(--error); font-size: 14px; }

  .final { text-align: center; padding: 48px 18px; }
  .final .check {
    width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%;
    display: grid; place-items: center; background: var(--ok); color: var(--bg); font-size: 28px; font-weight: 700;
  }
  .final h2 { font-size: 22px; margin-bottom: 8px; }
  .final p { color: var(--muted); }

  @media (max-width: 860px) {
    .layout { display: block; }
    .steps { display: none; }
    main { padding: 16px 16px 110px; }
    .movil { display: block; margin-bottom: 16px; font-size: 13px; color: var(--muted); }
    .acciones-in { padding: 10px 16px; }
    .top { padding: 10px 16px; }
    .who-text span { display: none; }
  }
  @media (max-width: 640px) {
    .escala { grid-template-columns: 1fr; gap: 6px; }
    .escala .opt-box {
      flex-direction: row; align-items: center; text-align: left; gap: 12px; padding: 9px 12px;
    }
    .escala .opt-n { width: 22px; text-align: center; }
    .escala .opt-f > span { display: inline; }
    .escala .opt-rg::before { content: " · "; }
    .card { padding: 14px; }
    .encabezado h2 { font-size: 19px; }
    .brand h1 { font-size: 15px; }
    .tabla th:nth-child(3), .tabla td:nth-child(3) { white-space: nowrap; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>Evaluación de desempeño</h1><span class="tag">Piloto</span></div>
  <div class="who" id="who" hidden>
    <div class="avatar" id="who-ini"></div>
    <div class="who-text"><b id="who-name"></b><span id="who-role"></span></div>
  </div>
</header>

<div class="layout">
  <nav class="steps" aria-label="Secciones">
    <ol id="pasos"></ol>
    <div class="avance"><span id="avance-txt"></span><div class="barra"><i id="avance-bar"></i></div></div>
  </nav>
  <main>
    <div class="movil"><span id="movil-txt"></span><div class="barra"><i id="movil-bar"></i></div></div>
    <div class="vista" id="vista"></div>
  </main>
</div>

<div class="acciones" id="acciones">
  <div class="acciones-in"><div>
    <button class="btn" id="btn-atras" type="button">Anterior</button>
    <button class="btn primario" id="btn-sig" type="button">Siguiente</button>
  </div></div>
</div>

<script>
const MODELO = <?!= modeloJson ?>;
const CLAVE = 'piloto-evaluacion-v1';
const JEFE = MODELO.roles[1];

const PASOS = [{ id: 'inicio', titulo: 'Inicio' }, { id: 'datos', titulo: 'Datos iniciales' }]
  .concat(MODELO.competencias.map(function (c) { return { id: c.id, titulo: c.nombre, comp: c }; }))
  .concat([{ id: 'cierre', titulo: 'Cierre del piloto' }]);

let estado = {
  paso: 0, visto: 0, inicio: null,
  datos: { nombre: '', area: '', cargo: '', rol: '', evaluado: '' },
  notas: {}, comentarios: {},
  cierre: { tiempo: '', dificil: '', escala: '', cambios: '' }
};
let enviado = false;

try {
  const g = JSON.parse(localStorage.getItem(CLAVE) || 'null');
  if (g && g.datos) estado = Object.assign(estado, g);
} catch (e) {}

function guardarBorrador() {
  try { localStorage.setItem(CLAVE, JSON.stringify(estado)); } catch (e) {}
}

const $ = function (id) { return document.getElementById(id); };
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
  });
}

function totalItems() {
  return MODELO.competencias.reduce(function (n, c) { return n + c.comportamientos.length; }, 0);
}
function respondidos() { return Object.keys(estado.notas).length; }

function pasoCompleto(i) {
  const p = PASOS[i];
  if (p.id === 'inicio') return estado.visto > 0;
  if (p.id === 'datos') return faltantesDatos().length === 0;
  if (p.comp) return p.comp.comportamientos.every(function (b) { return estado.notas[b.id] != null; });
  return false;
}

function pintarNav() {
  $('pasos').innerHTML = PASOS.map(function (p, i) {
    const clase = i === estado.paso ? 'actual' : (pasoCompleto(i) ? 'listo' : '');
    const marca = pasoCompleto(i) && i !== estado.paso ? '✓' : (i + 1);
    return '<li class="' + clase + '"><button type="button" data-ir="' + i + '"' +
      (i > estado.visto ? ' disabled' : '') + '><span class="dot">' + marca + '</span>' + esc(p.titulo) + '</button></li>';
  }).join('');
  const r = respondidos(), t = totalItems();
  const pct = Math.round(r / t * 100) + '%';
  $('avance-txt').textContent = r + ' de ' + t + ' comportamientos calificados';
  $('avance-bar').style.width = pct;
  $('movil-txt').textContent = 'Paso ' + (estado.paso + 1) + ' de ' + PASOS.length + ' · ' + r + ' de ' + t + ' calificados';
  $('movil-bar').style.width = Math.round(estado.paso / (PASOS.length - 1) * 100) + '%';

  const d = estado.datos;
  const evaluado = d.rol === JEFE ? d.evaluado : d.nombre;
  if (evaluado && d.rol) {
    $('who').hidden = false;
    $('who-ini').textContent = evaluado.trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase();
    $('who-name').textContent = evaluado;
    $('who-role').textContent = d.rol === JEFE ? 'Colaborador evaluado' : 'Autoevaluación';
  } else {
    $('who').hidden = true;
  }

  $('btn-atras').style.visibility = estado.paso === 0 ? 'hidden' : 'visible';
  const ultimo = estado.paso === PASOS.length - 1;
  $('btn-sig').textContent = estado.paso === 0 ? 'Comenzar' : (ultimo ? 'Enviar evaluación' : 'Siguiente');
}

function opcion(nombre, valor, contenido, marcado, claseExtra) {
  return '<label class="opt' + (claseExtra ? ' ' + claseExtra : '') + '"><input type="radio" name="' + esc(nombre) +
    '" value="' + esc(valor) + '"' + (marcado ? ' checked' : '') + '><span class="opt-box">' + contenido + '</span></label>';
}

function vistaInicio() {
  const filas = MODELO.escala.map(function (e) {
    return '<tr><td>' + e.valor + '</td><td>' + esc(e.etiqueta) + '</td><td>' + esc(e.frecuencia) + '</td><td>' + esc(e.rango) + '</td></tr>';
  }).join('');
  return '<div class="encabezado"><p class="kicker">Cornerstone Perú</p><h2>Prueba piloto de la evaluación de desempeño</h2></div>' +
    '<div class="card intro">' +
      '<p>Gracias por ayudarnos a probar la evaluación antes de lanzarla en BUK del 16 al 20 de noviembre.</p>' +
      '<ul class="puntos">' +
        '<li><b>Para qué es.</b> Queremos detectar comportamientos que se entiendan mal y medir cuánto tiempo toma completarla.</li>' +
        '<li><b>No tiene consecuencias.</b> Nadie será evaluado con estas respuestas. Responde con normalidad, como si fuera la evaluación real.</li>' +
        '<li><b>Tiempo aproximado.</b> Entre 15 y 20 minutos. Tu avance se guarda en este dispositivo si cierras la página.</li>' +
        '<li><b>Qué vas a calificar.</b> 30 comportamientos agrupados en 6 competencias. Al final de cada competencia puedes dejar un ejemplo concreto.</li>' +
        '<li><b>Cómo usar la escala.</b> En cada comportamiento elige con qué frecuencia lo observas, en ti o en tu colaborador. La escala aparece siempre junto a cada comportamiento, así que no necesitas memorizarla.</li>' +
      '</ul>' +
    '</div>' +
    '<div class="card"><h3 style="font-size:16px">Escala de calificación</h3>' +
      '<table class="tabla"><thead><tr><th>Nivel</th><th>Etiqueta</th><th>Frecuencia</th><th>Rango</th></tr></thead><tbody>' + filas + '</tbody></table>' +
      '<p class="guia">Algunos comportamientos tienen una opción adicional. Usa “No tuve oportunidad de observarlo” solo si la situación no se presentó. En “Empoderamiento y Liderazgo” elige “No aplica” si no hay equipo a cargo.</p>' +
    '</div>' +
    '<div class="card"><p>Al final hay 4 preguntas breves sobre tu experiencia. Son las más importantes del piloto, así que te pedimos responderlas con detalle.</p></div>';
}

function vistaDatos() {
  const d = estado.datos;
  function texto(k, etiqueta, ph) {
    return '<div class="campo" id="campo-' + k + '"><label for="f-' + k + '">' + etiqueta + '</label>' +
      '<input type="text" id="f-' + k + '" data-dato="' + k + '" value="' + esc(d[k]) + '" placeholder="' + esc(ph) + '" autocomplete="off">' +
      '<p class="error">Este dato es obligatorio.</p></div>';
  }
  const roles = MODELO.roles.map(function (r) {
    return opcion('rol', r, '<span class="marca"></span>' + esc(r), d.rol === r);
  }).join('');
  return '<div class="encabezado"><p class="kicker">Paso 2</p><h2>Datos iniciales</h2></div>' +
    '<div class="card">' +
      texto('nombre', 'Nombre y apellido', 'Ej. Ana Torres') +
      texto('area', 'Área', 'Ej. Talento') +
      texto('cargo', 'Cargo', 'Ej. Consultora senior') +
      '<div class="campo" id="campo-rol"><span class="label">Rol en la evaluación</span><div class="opciones">' + roles + '</div>' +
        '<p class="error">Elige tu rol en la evaluación.</p></div>' +
      '<div id="bloque-evaluado"' + (d.rol === JEFE ? '' : ' hidden') + '>' +
        texto('evaluado', 'Nombre del colaborador evaluado', 'Ej. Luis Ramírez') +
      '</div>' +
    '</div>';
}

function vistaCompetencia(c, n) {
  const d = estado.datos;
  const yo = d.rol !== JEFE;
  const guia = yo
    ? 'Califica con qué frecuencia realizas cada comportamiento.'
    : 'Califica con qué frecuencia observas cada comportamiento en ' + esc(d.evaluado || 'tu colaborador') + '.';
  const items = c.comportamientos.map(function (b, j) {
    const v = estado.notas[b.id];
    const escala = MODELO.escala.map(function (e) {
      return opcion(b.id, e.valor,
        '<span class="opt-n">' + e.valor + '</span><span class="opt-txt"><span class="opt-l">' + esc(e.etiqueta) + '</span>' +
        '<span class="opt-f"><span>' + esc(e.frecuencia) + '</span><span class="opt-rg">' + esc(e.rango) + '</span></span></span>', String(v) === String(e.valor));
    }).join('');
    const extra = b.extra
      ? '<div>' + opcion(b.id, b.extra, '<span class="marca"></span>' + esc(b.extra), v === b.extra, 'extra') + '</div>' +
        (b.ayudaExtra ? '<p class="ayuda">' + esc(yo ? b.ayudaExtraYo : b.ayudaExtra) + '</p>' : '')
      : '';
    return '<article class="card" id="item-' + b.id + '">' +
      '<div class="item-head"><span class="num">' + n + '.' + (j + 1) + '</span><h3>' + esc(b.nombre) + '</h3></div>' +
      '<p class="item-text">' + esc(yo ? b.textoYo : b.texto) + '</p>' +
      '<div class="escala" role="radiogroup" aria-label="' + esc(b.nombre) + '">' + escala + '</div>' + extra +
      '<p class="error">Elige una opción para continuar.</p></article>';
  }).join('');
  return '<div class="encabezado"><p class="kicker">Competencia ' + n + ' de ' + MODELO.competencias.length + '</p>' +
      '<h2>' + esc(c.nombre) + '</h2>' +
      '<div class="definicion"><b>Definición</b>' + esc(c.definicion) + '</div>' +
      '<p class="guia">' + guia + '</p></div>' +
    items +
    '<div class="card comentario"><label for="com-' + c.id + '">Comentario <span class="opcional">(opcional)</span></label>' +
      '<p class="ayuda" style="margin:2px 0 8px">Describe un ejemplo concreto que respalde tus calificaciones en esta competencia.</p>' +
      '<textarea id="com-' + c.id + '" data-com="' + c.id + '" placeholder="Ej. En el proyecto con el cliente X, ...">' + esc(estado.comentarios[c.id]) + '</textarea></div>';
}

function vistaCierre() {
  const ci = estado.cierre;
  const tiempos = MODELO.tiempos.map(function (t) { return opcion('tiempo', t, '<span class="marca"></span>' + esc(t), ci.tiempo === t); }).join('');
  const claridad = MODELO.claridad.map(function (t) { return opcion('escala', t, '<span class="marca"></span>' + esc(t), ci.escala === t); }).join('');
  return '<div class="encabezado"><p class="kicker">Último paso</p><h2>Cierre del piloto</h2>' +
      '<p class="guia">Tus respuestas aquí nos ayudan a mejorar la versión oficial.</p></div>' +
    '<div class="card">' +
      '<div class="campo" id="campo-tiempo"><span class="label">¿Cuánto tiempo te tomó completarla?</span><div class="opciones">' + tiempos + '</div>' +
        '<p class="error">Elige una opción.</p></div>' +
      '<div class="campo" id="campo-dificil"><label for="f-dificil">¿Hubo algún comportamiento difícil de entender o de evaluar? ¿Cuál?</label>' +
        '<p class="ayuda" style="margin:0 0 8px">Indica el nombre del comportamiento y qué te costó. Si ninguno, escribe “Ninguno”.</p>' +
        '<textarea id="f-dificil" data-cierre="dificil">' + esc(ci.dificil) + '</textarea>' +
        '<p class="error">Esta respuesta es obligatoria.</p></div>' +
      '<div class="campo" id="campo-escala"><span class="label">¿La escala fue clara?</span><div class="opciones fila">' + claridad + '</div>' +
        '<p class="error">Elige una opción.</p></div>' +
      '<div class="campo"><label for="f-cambios">¿Qué cambiarías? <span class="opcional">(opcional)</span></label>' +
        '<textarea id="f-cambios" data-cierre="cambios">' + esc(ci.cambios) + '</textarea></div>' +
      '<p class="aviso" id="aviso" hidden></p>' +
    '</div>';
}

function pintar() {
  const p = PASOS[estado.paso];
  let html;
  if (p.id === 'inicio') html = vistaInicio();
  else if (p.id === 'datos') html = vistaDatos();
  else if (p.id === 'cierre') html = vistaCierre();
  else html = vistaCompetencia(p.comp, MODELO.competencias.indexOf(p.comp) + 1);
  $('vista').innerHTML = html;
  pintarNav();
}

function faltantesDatos() {
  const d = estado.datos, f = [];
  ['nombre', 'area', 'cargo'].forEach(function (k) { if (!d[k].trim()) f.push('campo-' + k); });
  if (!d.rol) f.push('campo-rol');
  if (d.rol === JEFE && !d.evaluado.trim()) f.push('campo-evaluado');
  return f;
}

function faltantes() {
  const p = PASOS[estado.paso];
  if (p.id === 'datos') return faltantesDatos();
  if (p.comp) return p.comp.comportamientos.filter(function (b) { return estado.notas[b.id] == null; }).map(function (b) { return 'item-' + b.id; });
  if (p.id === 'cierre') {
    const ci = estado.cierre, f = [];
    if (!ci.tiempo) f.push('campo-tiempo');
    if (!ci.dificil.trim()) f.push('campo-dificil');
    if (!ci.escala) f.push('campo-escala');
    return f;
  }
  return [];
}

function marcarFaltantes(ids) {
  document.querySelectorAll('.falta').forEach(function (el) { el.classList.remove('falta'); });
  ids.forEach(function (id) { const el = $(id); if (el) el.classList.add('falta'); });
  if (ids.length) $(ids[0]).scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function ir(i) {
  estado.paso = i;
  estado.visto = Math.max(estado.visto, i);
  guardarBorrador();
  pintar();
  window.scrollTo(0, 0);
}

$('vista').addEventListener('change', function (ev) {
  const t = ev.target;
  if (t.type !== 'radio') return;
  if (t.name === 'rol') {
    estado.datos.rol = t.value;
    $('bloque-evaluado').hidden = t.value !== JEFE;
  } else if (t.name === 'tiempo' || t.name === 'escala') {
    estado.cierre[t.name] = t.value;
  } else {
    estado.notas[t.name] = /^\d$/.test(t.value) ? Number(t.value) : t.value;
  }
  const bloque = t.closest('.card.falta, .campo.falta');
  if (bloque) bloque.classList.remove('falta');
  guardarBorrador();
  pintarNav();
});

$('vista').addEventListener('input', function (ev) {
  const t = ev.target;
  if (t.dataset.dato) estado.datos[t.dataset.dato] = t.value;
  else if (t.dataset.com) estado.comentarios[t.dataset.com] = t.value;
  else if (t.dataset.cierre) estado.cierre[t.dataset.cierre] = t.value;
  else return;
  const bloque = t.closest('.falta');
  if (bloque && t.value.trim()) bloque.classList.remove('falta');
  guardarBorrador();
  if (t.dataset.dato) pintarNav();
});

$('pasos').addEventListener('click', function (ev) {
  const b = ev.target.closest('[data-ir]');
  if (b && !b.disabled) ir(Number(b.dataset.ir));
});

$('btn-atras').addEventListener('click', function () { if (estado.paso > 0) ir(estado.paso - 1); });

$('btn-sig').addEventListener('click', function () {
  if (estado.paso === 0 && !estado.inicio) estado.inicio = Date.now();
  const f = faltantes();
  if (f.length) { marcarFaltantes(f); return; }
  if (estado.paso < PASOS.length - 1) { ir(estado.paso + 1); return; }
  enviar();
});

function enviar() {
  const incompletas = PASOS.map(function (p, i) { return i; }).filter(function (i) {
    return (PASOS[i].comp || PASOS[i].id === 'datos') && !pasoCompleto(i);
  });
  if (incompletas.length) { ir(incompletas[0]); setTimeout(function () { marcarFaltantes(faltantes()); }, 50); return; }

  const btn = $('btn-sig');
  btn.disabled = true;
  btn.textContent = 'Enviando…';
  const aviso = $('aviso');
  aviso.hidden = true;
  const datos = Object.assign({}, estado.datos);
  if (datos.rol !== JEFE) datos.evaluado = '';
  const minutos = estado.inicio ? (Date.now() - estado.inicio) / 60000 : null;
  const payload = { datos: datos, notas: estado.notas, comentarios: estado.comentarios, cierre: estado.cierre, minutos: minutos };

  function ok() {
    enviado = true;
    try { localStorage.removeItem(CLAVE); } catch (e) {}
    $('acciones').hidden = true;
    $('vista').innerHTML = '<div class="card final"><div class="check">✓</div><h2>¡Gracias!</h2>' +
      '<p>Tu evaluación de prueba se envió correctamente. Ya puedes cerrar esta página.</p></div>';
    estado.paso = PASOS.length - 1;
    estado.visto = PASOS.length - 1;
    pintarNav();
    $('btn-atras').style.visibility = 'hidden';
    window.scrollTo(0, 0);
  }
  function fallo(err) {
    btn.disabled = false;
    btn.textContent = 'Enviar evaluación';
    aviso.hidden = false;
    aviso.textContent = 'No se pudo enviar. ' + ((err && err.message) || 'Revisa tu conexión e inténtalo de nuevo.') + ' Tus respuestas siguen guardadas en esta página.';
  }
  if (window.google && google.script && google.script.run) {
    google.script.run.withSuccessHandler(ok).withFailureHandler(fallo).guardarRespuesta(payload);
  } else {
    console.log('Vista previa sin servidor', payload);
    window.__ultimoEnvio = payload;
    setTimeout(ok, 300);
  }
}

window.addEventListener('beforeunload', function (ev) {
  if (!enviado && estado.visto > 1) { ev.preventDefault(); ev.returnValue = ''; }
});

pintar();
</script>
</body>
</html>
