<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tira botella Halloween</title>
<style>
  @font-face { font-family: "Lobster"; src: url(assets/fonts/lobster.woff2) format("woff2"); }
  @font-face { font-family: "Plus Jakarta Sans"; src: url(assets/fonts/plus-jakarta-sans.woff2) format("woff2"); font-weight: 200 800; }
  @page { size: 190mm 25mm; margin: 0; }

  /* Tira para botella: 190 × 25 mm · versión clara y divertida */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 190mm; height: 25mm; background: #FFF6E9; overflow: hidden; }
  .strip {
    position: relative; width: 190mm; height: 25mm; overflow: hidden; color: #004887;
    font-family: "Plus Jakarta Sans", sans-serif;
    background:
      radial-gradient(circle at 1.2mm 1.2mm, rgba(238,127,53,.16) .55mm, transparent .7mm) 0 0 / 5mm 5mm,
      linear-gradient(180deg, #FFF6E9, #FDEBD6);
    display: flex; align-items: center; justify-content: space-between; padding: 0 6mm 0 16mm;
  }
  /* ondas de color arriba y abajo */
  svg.deco { position: absolute; inset: 0; width: 100%; height: 100%; }
  .t { position: relative; flex: none; transform: rotate(-3deg); }
  .t h1 { font-family: "Lobster", cursive; font-weight: 400; font-size: 7.6mm; line-height: 1; color: #004887; }
  .t h1 span { color: #EE7F35; }
  .tag { position: relative; flex: none; transform: rotate(3deg); background: #EE7F35; color: #FFFFFF; border-radius: 2mm; padding: 1.2mm 3mm 1.4mm; text-align: center; box-shadow: .5mm .6mm 0 #0D1427; }
  .tag .k { font-size: 2.3mm; font-weight: 800; letter-spacing: .4mm; text-transform: uppercase; }
  .tag .v { font-family: "Lobster", cursive; font-size: 4.8mm; line-height: 1; }
  .logo { position: relative; flex: none; height: 4.3mm; display: block; }
  .pkh { position: relative; flex: none; width: 11mm; height: 15.7mm; overflow: visible; }
  .rec { position: relative; flex: none; display: flex; align-items: center; gap: 1.5mm; }
  .rec svg { width: 7.6mm; height: 7.6mm; flex: none; }
  .rec p { font-size: 2.6mm; font-weight: 800; line-height: 1.2; color: #0D1427; }
  .rec p span { color: #CB333B; }
</style>
</head>
<body>
<div class="strip">
  <svg class="deco" viewBox="0 0 190 25" aria-hidden="true">
    <defs>
      <symbol id="bat" viewBox="0 14 100 30"><path d="M50 41 C54 35 59 34 63 38 C67 32 75 31 80 36 C84 28 92 24 100 24 C88 16 72 16 62 24 C58 22 56 22 54 23.5 L53 17 L51 21.5 L49 21.5 L47 17 L46 23.5 C44 22 42 22 38 24 C28 16 12 16 0 24 C8 24 16 28 20 36 C25 31 33 32 37 38 C41 34 46 35 50 41 Z"/></symbol>
      <symbol id="pk" viewBox="0 0 100 100"><path d="M50 20 C49 12 52 6 58 3" fill="none" stroke="#0D1427" stroke-width="6" stroke-linecap="round"/><ellipse cx="29" cy="60" rx="26" ry="36" fill="#D9662A"/><ellipse cx="71" cy="60" rx="26" ry="36" fill="#D9662A"/><ellipse cx="50" cy="60" rx="29" ry="38" fill="#EE7F35"/><g fill="#0D1427"><path d="M30 52 L40 40 L45 54 Z"/><path d="M70 52 L60 40 L55 54 Z"/><path d="M26 66 Q50 92 74 66 Q66 70 61 69 L58 75 L54 70 L50 76 L46 70 L42 75 L39 69 Q34 70 26 66 Z"/></g></symbol>
      <symbol id="candy" viewBox="0 0 40 20"><polygon points="12,10 2,3 3,17" fill="#004887"/><polygon points="28,10 38,3 37,17" fill="#004887"/><ellipse cx="20" cy="10" rx="9" ry="7" fill="#CB333B"/><path d="M17 4 Q20 10 17 16 M23 4 Q26 10 23 16" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-opacity=".85"/></symbol>
    </defs>
    <!-- ondas -->
    <path d="M0 0 H190 V1.6 Q185 3.2 180 1.6 T170 1.6 T160 1.6 T150 1.6 T140 1.6 T130 1.6 T120 1.6 T110 1.6 T100 1.6 T90 1.6 T80 1.6 T70 1.6 T60 1.6 T50 1.6 T40 1.6 T30 1.6 T20 1.6 T10 1.6 T0 1.6 Z" fill="#004887"/>
    <path d="M0 25 H190 V23.4 Q185 21.8 180 23.4 T170 23.4 T160 23.4 T150 23.4 T140 23.4 T130 23.4 T120 23.4 T110 23.4 T100 23.4 T90 23.4 T80 23.4 T70 23.4 T60 23.4 T50 23.4 T40 23.4 T30 23.4 T20 23.4 T10 23.4 T0 23.4 Z" fill="#EE7F35"/>

    <!-- fantasma asomándose por abajo -->
    <g transform="translate(5.5 9.5) scale(.105)">
      <path d="M18 50 A32 32 0 0 1 82 50 V160 H18 Z" fill="#FFFFFF" stroke="#004887" stroke-width="5"/>
      <ellipse cx="39" cy="54" rx="5.5" ry="8" fill="#004887"/><ellipse cx="61" cy="54" rx="5.5" ry="8" fill="#004887"/>
      <ellipse cx="31" cy="68" rx="5" ry="3" fill="#EE7F35" fill-opacity=".6"/><ellipse cx="69" cy="68" rx="5" ry="3" fill="#EE7F35" fill-opacity=".6"/>
      <path d="M43 70 Q50 77 57 70" fill="none" stroke="#004887" stroke-width="4" stroke-linecap="round"/>
      <path d="M18 80 Q6 70 4 58" fill="none" stroke="#004887" stroke-width="5" stroke-linecap="round"/>
    </g>
    <use href="#bat" x="2.5" y="4" width="6" height="1.8" fill="#0D1427"/>

    <!-- araña colgando -->
    <line x1="186.6" y1="1.6" x2="186.6" y2="9.2" stroke="#0D1427" stroke-width=".25"/>
    <g transform="translate(184.7 8.6) scale(.095)" stroke="#0D1427" stroke-width="2.5" stroke-linecap="round"><path d="M12 18 L3 12 M12 22 L2 22 M12 26 L4 33 M28 18 L37 12 M28 22 L38 22 M28 26 L36 33" fill="none"/><ellipse cx="20" cy="23" rx="9" ry="10" fill="#0D1427" stroke="none"/><circle cx="20" cy="11" r="6" fill="#0D1427" stroke="none"/></g>

    <!-- caramelos y murciélagos -->
    <use href="#candy" x="112" y="3.4" width="6" height="3" transform="rotate(-18 115 4.9)"/>
    <use href="#bat" x="95" y="3.4" width="6.5" height="2" fill="#004887"/>
    <use href="#candy" x="118" y="18.5" width="6" height="3" transform="rotate(14 121 20)"/>
    <use href="#bat" x="132" y="3.4" width="5.5" height="1.7" fill="#0D1427"/>

  </svg>

  <div class="t"><h1>¡Feliz <span>Halloween</span>!</h1></div>

  <div class="tag"><div class="k">Jueves · 2026</div><div class="v">29 de octubre</div></div>

  <img class="logo" src="assets/logo-cornerstone-horizontal.png" alt="Cornerstone">

  <svg class="pkh" viewBox="-1 -5 14 20" aria-hidden="true">
    <use href="#pk" x="0" y="2" width="12" height="12"/>
    <g transform="rotate(-12 6 2)"><ellipse cx="6" cy="3.6" rx="6.4" ry="1.3" fill="#004887"/><path d="M2.4 3.4 C3.4 1.4 4 -1.8 6 -3.6 C7 -4.4 8.6 -4.4 9.6 -3.8 C8.4 -3.4 7.6 -2.6 7.8 -1.2 C8.2 0.6 9 2 10 3.4 Z" fill="#004887"/><rect x="2.8" y="2.3" width="6.8" height="1" fill="#CB333B"/></g>
  </svg>

  <div class="rec">
    <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47" fill="#004887"/><g fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M24.5 45 A26 26 0 0 1 71 34.5"/><path d="M61 33 L71.5 35 L74 24.5"/><path d="M75.5 55 A26 26 0 0 1 29 65.5"/><path d="M39 67 L28.5 65 L26 75.5"/></g></svg>
    <p><span>¡Recíclame!</span><br>Soy sostenible</p>
  </div>
</div>
</body>
</html>
